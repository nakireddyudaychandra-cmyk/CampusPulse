    <!-- =========================================
     ADMIN LOGIN PROTECTION
========================================== -->
<script>
    document.documentElement.style.visibility = "hidden";
    const ADMIN_API_BASE = "https://campuspulse-backend-a0n6.onrender.com"";

    async function verifyAdminAccess() {
        const token = localStorage.getItem("campuspulse_admin_token");
        const session = sessionStorage.getItem("campuspulse_admin_logged_in");

        if (session !== "true" || !token) {
            localStorage.removeItem("campuspulse_admin_token");
            localStorage.removeItem("campuspulse_admin");
            sessionStorage.removeItem("campuspulse_admin_logged_in");
            window.location.replace("admin-login.html");
            return false;
        }

        try {
            const response = await fetch(`${ADMIN_API_BASE}/admin/check`, {
                method: "GET",
                headers: { "X-Admin-Key": token },
                cache: "no-store"
            });

            if (!response.ok) throw new Error("Admin authentication failed");

            document.documentElement.style.visibility = "visible";
            return true;
        } catch (error) {
            console.error("Admin verification failed:", error);
            localStorage.removeItem("campuspulse_admin_token");
            localStorage.removeItem("campuspulse_admin");
            sessionStorage.removeItem("campuspulse_admin_logged_in");
            window.location.replace("admin-login.html");
            return false;
        }
    }

    verifyAdminAccess();
</script>

<script>


// =================================================
// API URL
// =================================================

const API_BASE =
    "https://campuspulse-backend-a0n6.onrender.com";


function adminHeaders(extra = {}) {

    const token =
        localStorage.getItem(
            "campuspulse_admin_token"
        );

    return {
        ...extra,
        "X-Admin-Key": token
    };
}


async function adminFetch(
    url,
    options = {}
) {

    options.headers =
        adminHeaders(
            options.headers || {}
        );

    const response =
        await fetch(
            url,
            options
        );

    if (response.status === 401) {

        localStorage.removeItem(
            "campuspulse_admin_token"
        );

        localStorage.removeItem(
            "campuspulse_admin"
        );

        sessionStorage.removeItem(
            "campuspulse_admin_logged_in"
        );

        sessionStorage.removeItem(
            "campuspulse_admin_login_time"
        );

        window.location.replace(
            "admin-login.html"
        );

        throw new Error(
            "Admin session expired"
        );
    }

    return response;
}



// =================================================
// STORE STAFF
// =================================================

let staffList = [];



// =================================================
// LOGOUT
// =================================================

async function logoutAdmin() {

    try {

        await adminFetch(
            `${API_BASE}/admin/logout`,
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.log(error);

    }

    localStorage.removeItem(
        "campuspulse_admin_token"
    );

    localStorage.removeItem(
        "campuspulse_admin"
    );

    sessionStorage.removeItem(
        "campuspulse_admin_logged_in"
    );

    sessionStorage.removeItem(
        "campuspulse_admin_login_time"
    );

    window.location.replace(
        "admin-login.html"
    );
}



// =================================================
// LOAD EVERYTHING
// =================================================

async function loadAdminData() {

    try {

        await loadStaff();

        await loadIssues();

        await loadClusters();


        document.getElementById(
            "connectionMessage"
        ).className =
            "message success";


        document.getElementById(
            "connectionMessage"
        ).innerHTML =
            "✅ Connected to CampusPulse server successfully.";

    }


    catch (error) {

        console.error(error);


        document.getElementById(
            "connectionMessage"
        ).className =
            "message error";


        document.getElementById(
            "connectionMessage"
        ).innerHTML =
            "❌ Cannot connect to CampusPulse server." +
            "<br><br>" +
            "Make sure the FastAPI backend is running.";

    }

}



// =================================================
// LOAD STAFF
// =================================================

async function loadStaff() {

    const response =
        await adminFetch(
            `${API_BASE}/staff`
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load staff"
        );

    }


    staffList =
        await response.json();


    console.log(
        "Staff:",
        staffList
    );

}



// =================================================
// LOAD ISSUES
// =================================================

async function loadIssues() {

    const response =
        await adminFetch(
            `${API_BASE}/issues`
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load issues"
        );

    }


    const issues =
        await response.json();


    updateStatistics(
        issues
    );


    displayIssues(
        issues
    );

}



// =================================================
// UPDATE STATISTICS
// =================================================

function updateStatistics(
    issues
) {

    document.getElementById(
        "totalReports"
    ).textContent =
        issues.length;


    document.getElementById(
        "openReports"
    ).textContent =
        issues.filter(
            issue =>
                issue.status === "OPEN"
        ).length;


    document.getElementById(
        "progressReports"
    ).textContent =
        issues.filter(
            issue =>
                issue.status === "IN PROGRESS"
        ).length;


    document.getElementById(
        "resolvedReports"
    ).textContent =
        issues.filter(
            issue =>
                issue.status === "RESOLVED"
        ).length;

}



// =================================================
// DISPLAY ISSUES
// =================================================

function displayIssues(
    issues
) {

    const container =
        document.getElementById(
            "issuesContainer"
        );


    container.innerHTML = "";


    if (issues.length === 0) {

        container.innerHTML = `

            <div class="message">

                No issues reported yet.

            </div>

        `;

        return;

    }


    issues.forEach(
        issue => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "issue-card";


            card.innerHTML = `

                <div class="issue-title">

                    #${issue.id}

                    ${escapeHTML(
                        issue.title
                    )}

                </div>


                <div class="issue-description">

                    ${escapeHTML(
                        issue.description
                    )}

                </div>


                <div class="issue-info">

                    📍

                    <strong>
                        Location:
                    </strong>

                    ${escapeHTML(
                        issue.location
                    )}

                </div>


                <div class="issue-info">

                    🤖

                    <strong>
                        AI Category:
                    </strong>

                    ${escapeHTML(
                        issue.category ||
                        "Pending"
                    )}

                </div>


                <div class="issue-info">

                    ⚠️

                    <strong>
                        Priority:
                    </strong>

                    ${escapeHTML(
                        issue.priority ||
                        "Pending"
                    )}

                </div>


                <div>

                    <span
                        class="
                            status-badge
                            ${getStatusClass(
                                issue.status
                            )}
                        ">

                        ${escapeHTML(
                            issue.status
                        )}

                    </span>

                </div>


                ${getAssignedStaffHTML(
                    issue
                )}


                <div class="staff-box">

                    <h4>

                        👨‍🔧 Assign Staff

                    </h4>


                    <select
                        class="staff-select"
                        id="staff-${issue.id}">

                        <option value="">

                            Select staff member

                        </option>


                        ${getStaffOptions(
                            issue
                        )}

                    </select>


                    <button
                        class="assign-btn"
                        onclick="
                            assignStaff(
                                ${issue.id}
                            )
                        ">

                        Assign Staff

                    </button>

                </div>


                <div class="status-box">

                    <select
                        class="status-select"
                        id="status-${issue.id}">


                        <option
                            value="OPEN"
                            ${
                                issue.status === "OPEN"
                                ? "selected"
                                : ""
                            }>

                            OPEN

                        </option>


                        <option
                            value="IN PROGRESS"
                            ${
                                issue.status === "IN PROGRESS"
                                ? "selected"
                                : ""
                            }>

                            IN PROGRESS

                        </option>


                        <option
                            value="RESOLVED"
                            ${
                                issue.status === "RESOLVED"
                                ? "selected"
                                : ""
                            }>

                            RESOLVED

                        </option>


                    </select>


                    <button
                        class="status-btn"
                        onclick="
                            updateStatus(
                                ${issue.id}
                            )
                        ">

                        Update Status

                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}



// =================================================
// STAFF OPTIONS
// =================================================

function getStaffOptions(
    issue
) {

    if (!staffList.length) {

        return `

            <option value="">

                No staff available

            </option>

        `;

    }


    return staffList
        .map(
            staff => `

                <option
                    value="${staff.id}"
                    ${
                        issue.assigned_staff_id ==
                        staff.id
                        ? "selected"
                        : ""
                    }>

                    ${escapeHTML(
                        staff.name
                    )}

                    -

                    ${escapeHTML(
                        staff.specialization
                    )}

                </option>

            `
        )
        .join("");

}



// =================================================
// ASSIGNED STAFF HTML
// =================================================

function getAssignedStaffHTML(
    issue
) {

    if (!issue.assigned_staff_id) {

        return `

            <div class="assigned-staff">

                👨‍🔧

                <strong>
                    Staff:
                </strong>

                Not assigned yet

            </div>

        `;

    }


    const staff =
        staffList.find(
            s =>
                s.id ==
                issue.assigned_staff_id
        );


    if (!staff) {

        return `

            <div class="assigned-staff">

                👨‍🔧

                <strong>
                    Staff ID:
                </strong>

                ${issue.assigned_staff_id}

            </div>

        `;

    }


    return `

        <div class="assigned-staff">

            👨‍🔧

            <strong>
                Assigned Staff
            </strong>

            <br>

            ${escapeHTML(
                staff.name
            )}

            <br>

            🔧

            Specialization:

            ${escapeHTML(
                staff.specialization
            )}

        </div>

    `;

}



// =================================================
// ASSIGN STAFF
// =================================================

async function assignStaff(
    issueId
) {

    const select =
        document.getElementById(
            `staff-${issueId}`
        );


    const staffId =
        select.value;


    if (!staffId) {

        alert(
            "Please select a staff member first."
        );

        return;

    }


    try {

        const response =
            await adminFetch(
                `${API_BASE}/issues/${issueId}/assign`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            staff_id:
                                Number(
                                    staffId
                                )

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Assignment failed"
            );

        }


        alert(
            "✅ Staff assigned successfully!"
        );


        await loadIssues();

    }


    catch (error) {

        console.error(error);


        alert(
            "❌ Could not assign staff.\n\n" +
            error.message
        );

    }

}



// =================================================
// UPDATE STATUS
// =================================================

async function updateStatus(
    issueId
) {

    const select =
        document.getElementById(
            `status-${issueId}`
        );


    const status =
        select.value;


    try {

        const response =
            await adminFetch(
                `${API_BASE}/issues/${issueId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            status: status
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Status update failed"
            );

        }


        alert(
            "✅ Issue status updated!"
        );


        await loadIssues();

    }


    catch (error) {

        console.error(error);


        alert(
            "❌ Could not update status.\n\n" +
            error.message
        );

    }

}



// =================================================
// LOAD AI CLUSTERS
// =================================================

async function loadClusters() {

    const response =
        await adminFetch(
            `${API_BASE}/clusters`
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load clusters"
        );

    }


    const clusters =
        await response.json();


    displayClusters(
        clusters
    );

}



// =================================================
// DISPLAY CLUSTERS
// =================================================

function displayClusters(
    clusters
) {

    const container =
        document.getElementById(
            "clustersContainer"
        );


    container.innerHTML = "";


    if (!clusters.length) {

        container.innerHTML = `

            <div class="cluster-card">

                No related issue clusters found.

            </div>

        `;

        return;

    }


    clusters.forEach(
        cluster => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "cluster-card";


            card.innerHTML = `

                <div class="cluster-title">

                    🔴 Possible Common Issue

                </div>


                <p>

                    <strong>
                        Location:
                    </strong>

                    ${escapeHTML(
                        cluster.location
                    )}

                </p>


                <p>

                    <strong>
                        Category:
                    </strong>

                    ${escapeHTML(
                        cluster.category
                    )}

                </p>


                <p>

                    <strong>
                        Related Reports:
                    </strong>

                    ${cluster.report_count}

                </p>


                <p>

                    The AI system detected
                    multiple reports that may
                    represent the same campus
                    problem.

                </p>

            `;


            container.appendChild(
                card
            );

        }
    );

}



// =================================================
// STATUS CLASS
// =================================================

function getStatusClass(
    status
) {

    if (
        status === "RESOLVED"
    ) {

        return "status-resolved";

    }


    if (
        status === "IN PROGRESS"
    ) {

        return "status-progress";

    }


    return "status-open";

}



// =================================================
// SECURITY / HTML ESCAPE
// =================================================

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =================================================
// START
// =================================================

loadAdminData();
